      /* On a REAL phone the frame IS the screen: no wrapper tricks at all.
         position:fixed elements (bottom nav, modals, headers) must stay fixed
         to the actual browser viewport, so #phone-frame stays a plain,
         untransformed block that just flows with the page. This avoids the
         bug where the bottom nav drifts up the page as the address bar
         shows/hides while scrolling. */
      #phone-frame {
        width: 100%;
        max-width: 100%;
        background: #fff;
      }
      #root { min-height: 100%; display: flex; flex-direction: column; }

      /* On desktop/tablet only: present it like a phone mockup centered on the
         page. The transform here creates a new containing block so fixed
         elements stay confined inside the mock frame instead of spanning the
         whole browser window. The breakpoint is set high (1024px) on purpose:
         some phone browsers/quick-view webviews ignore the viewport meta tag
         and fall back to a ~980px layout width, which used to wrongly trigger
         this "desktop" styling on real phones and break the layout. */
      @media (min-width: 1024px) {
        body { padding: 24px 0; }
        #phone-frame {
          max-width: 430px;
          height: calc(100vh - 48px);
          height: calc(100dvh - 48px);
          position: relative;
          overflow-y: auto;
          overflow-x: hidden;
          transform: translateZ(0);
          scrollbar-width: none;
          border-radius: 28px;
          box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 30px 70px rgba(0,0,0,0.5);
        }
        #phone-frame::-webkit-scrollbar { display: none; }
      }
